build:
  zip:
    composer:
      enabled: false
    assets:
      enabled: true
      enable_es_build_for_admin: true
      enable_es_build_for_storefront: true
    pack:
      excludes:
        paths:
          - var
          - .gitignore
          - tests
          - phpunit.xml.dist
validation:
  ignore:
    # 410 Gone intentionally has an empty body
    - identifier: phpstan/shopware.noEmptyResponse
      path: src/Subscriber/BeforeSendResponseSubscriber.php
